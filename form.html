<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Submit a product review by rating products, selecting useful features, and sharing your feedback.">
  <meta name="author" content="Okon Victor John">
  <title>Product Review</title>
  <link rel="stylesheet" href="styles/form.css">
  <script defer src="scripts/form.js"></script>
</head>

<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">

      <!-- Product -->
      <label for="product">Product Name</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <!-- Rating -->
      <label>Overall Rating</label>

        <div class="rating">

            <input type="radio" id="star1" name="rating" value="1" required>
            <label for="star1">☆</label>

            <input type="radio" id="star2" name="rating" value="2" required>
            <label for="star2">☆☆</label>

            <input type="radio" id="star3" name="rating" value="3" required>
            <label for="star3">☆☆☆</label>

            <input type="radio" id="star4" name="rating" value="4" required>
            <label for="star4">☆☆☆☆</label>

            <input type="radio" id="star5" name="rating" value="5" required>
            <label for="star5">☆☆☆☆☆</label>

        </div>

      <!-- Date -->
      <label for="installDate">Date of Installation</label>
      <input type="date" id="installDate" name="installDate" required>

      <!-- Features -->
      <label>Useful Features</label>

        <div class="features">

            <input type="checkbox" id="design" name="features" value="design">
            <label for="design">Design</label>

            <input type="checkbox" id="speed" name="features" value="speed">
            <label for="speed">Speed</label>

            <input type="checkbox" id="battery" name="features" value="battery">
            <label for="battery">Battery</label>

            <input type="checkbox" id="performance" name="features" value="performance">
            <label for="performance">Performance</label>

        </div>

      <!-- Review -->
      <label for="review">Written Review</label>
      <textarea id="review" name="review"></textarea>

      <!-- Username -->
      <label for="username">Your Name</label>
      <input type="text" id="username" name="username">

      <!-- Submit -->
      <input type="submit" value="Post Review">

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Product Reviews</p>
  </footer>
</body>
</html>
