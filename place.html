<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive country page about Nigeria for WDD 131">
  <meta name="author" content="Victor Okon">
  <title>Nigeria | Place Page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/place.css">
  <script src="scripts/place.js" defer></script>
</head>
<body>
  <header>
    <h1>Nigeria</h1>
  </header>

  <main>
    <section class="hero">
      <picture>
        <source srcset="images/nigeria-large.webp" media="(min-width: 700px)">
        <img src="images/nigeria-small.webp" alt="Beautiful landscape in Nigeria">
      </picture>

      <section class="card data">
        <h2>Data</h2>
        <p><strong>Area:</strong> 923,768 sq km</p>
        <p><strong>Population:</strong> 223 million</p>
        <p><strong>Capital:</strong> Abuja</p>
        <p><strong>Languages:</strong> English, Yoruba, Igbo, Hausa</p>
        <p><strong>Currency:</strong> Nigerian Naira</p>
        <p><strong>Time Zone:</strong> WAT</p>
        <p><strong>Calling Code:</strong> +234</p>
      </section>

      <section class="card weather">
        <h2>Weather</h2>
        <img src="images/weather.svg" alt="Partly cloudy weather icon" class="weather-icon">
        <p><strong>Temperature:</strong> <span id="temperature">28</span> °C</p>
        <p><strong>Conditions:</strong> Partly Cloudy</p>
        <p><strong>Wind:</strong> <span id="windSpeed">10</span> km/h</p>
        <p><strong>Wind Chill:</strong> <span id="windChill"></span></p>
      </section>
    </section>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> Victor Okon | Nigeria</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
